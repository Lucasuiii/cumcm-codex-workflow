name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements-ci.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -m compileall -q .agents/skills/cumcm-workflow/scripts tests
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in Path('.agents/skills/cumcm-workflow/schemas').glob('*.json'):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding='utf-8')))
          PY
